[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/crypto",
    "crates/providers",
    "crates/discord",
    "crates/storage",
    "crates/discord-sdk-ffi",
    "crates/app",
    "crates/desktop-launcher",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/iammarxg/RemoteMusicRP"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
