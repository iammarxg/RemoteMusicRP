# cargo-deny policy: advisories, licenses, bans, sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) for zbus 5 sub-crates, pulled
# in by keyring 4.2's Linux Secret Service store. They were merged into
# zbus 6; remove these ignores once keyring moves to zbus 6.
# Tracked in CLAUDE.md "Open items". Re-review by 2027-02-01.
ignore = [
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained: transitive via keyring 4.2 (zbus 5); merged into zbus 6" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained: transitive via keyring 4.2 (zbus 5); merged into zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained: transitive via keyring 4.2 (zbus 5); merged into zbus 6" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing RemoteMusicRP under AGPL-3.0.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Prefer rustls over OpenSSL everywhere.
deny = [
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
