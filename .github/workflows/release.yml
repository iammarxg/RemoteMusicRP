# SPDX-License-Identifier: AGPL-3.0-only
#
# Release: build every platform, sign with minisign, publish a DRAFT release.
#
# Trigger: push a tag vX.Y.Z that matches the version in Cargo.toml.
# The draft is checked and published by the owner; the updater and the
# Docker workflow ignore drafts, so nothing reaches users before that.
#
# Secrets (repository → Settings → Environments → "release"):
#   MINISIGN_SECRET_KEY  the full contents of remotemusicrp.key
#   MINISIGN_PASSWORD    its password
# Only the final "sign + publish draft" job can read them, and it runs no
# third-party code after checkout besides minisign from Ubuntu's archive.
#
# All actions are pinned by full commit SHA (tag in the trailing comment).
# No build cache is used: release builds start clean.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  prepare:
    name: Check version, build web UI, licence report, SBOM
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build web UI
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Licence report and SBOM
        run: |
          cargo install --locked --features cli cargo-about@0.9.3
          cargo install --locked cargo-cyclonedx@0.5.10
          cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
          cargo cyclonedx --format json --all-features --spec-version 1.5 -q
          mkdir sbom
          find crates -name '*.cdx.json' -exec cp {} sbom/ \;
          tar -czf remotemusicrp-${{ steps.v.outputs.version }}-sbom.cdx.tar.gz -C sbom .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared
          path: |
            web/dist
            THIRD-PARTY-LICENSES.html
            remotemusicrp-*-sbom.cdx.tar.gz
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          # Linux x86_64 includes the experimental server mode (the Discord
          # SDK is NOT bundled; it stays off unless configured).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: social-sdk
            appimagetool: appimagetool-x86_64.AppImage
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimagetool: appimagetool-aarch64.AppImage
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: .
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Embed the update signing public key
        shell: bash
        run: echo "REMOTEMUSICRP_UPDATE_PUBKEY=$(sed -n 2p remotemusicrp.pub)" >> "$GITHUB_ENV"
      - name: Reproducible timestamps
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # ---- Windows ---------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }} -p remotemusicrp -p remotemusicrp-desktop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = '${{ matrix.target }}'
          $rel = "target/$t/release"
          New-Item -ItemType Directory -Force out, "stage/remotemusicrp-$env:VERSION-$t" | Out-Null
          Copy-Item "$rel/remotemusicrp.exe" "out/remotemusicrp-$t.exe"
          $s = "stage/remotemusicrp-$env:VERSION-$t"
          Copy-Item "$rel/remotemusicrp.exe", "$rel/remotemusicrp-desktop.exe", LICENSE, THIRD-PARTY-LICENSES.html, docs/INSTALL.md $s
          Compress-Archive -Path $s -DestinationPath "out/remotemusicrp-$env:VERSION-$t.zip"

      # ---- macOS -----------------------------------------------------------
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          t=${{ matrix.target }}
          cargo build --release --locked --target "$t" -p remotemusicrp
          mkdir -p out "stage/remotemusicrp-$VERSION-$t"
          cp "target/$t/release/remotemusicrp" "out/remotemusicrp-$t"
          cp "target/$t/release/remotemusicrp" LICENSE THIRD-PARTY-LICENSES.html docs/INSTALL.md "stage/remotemusicrp-$VERSION-$t/"
          tar -czf "out/remotemusicrp-$VERSION-$t.tar.gz" -C stage "remotemusicrp-$VERSION-$t"

      # ---- Linux (glibc 2.28 floor via zig) --------------------------------
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r packaging/ci/zig-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild@0.24.1 cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/${{ matrix.appimagetool }}"
          echo "${{ matrix.appimagetool_sha256 }}  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          features=""
          if [ -n "${{ matrix.features }}" ]; then features="--features ${{ matrix.features }}"; fi
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28 -p remotemusicrp $features
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh "$VERSION" ${{ matrix.target }} out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Sign and publish draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: prepared
      - name: Add licence report, SBOM and Arch PKGBUILD
        run: |
          cp prepared/THIRD-PARTY-LICENSES.html prepared/remotemusicrp-*-sbom.cdx.tar.gz dist/
          x86=$(sha256sum "dist/remotemusicrp-$VERSION-x86_64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "dist/remotemusicrp-$VERSION-aarch64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256_X86_64@/$x86/" -e "s/@SHA256_AARCH64@/$arm/" \
            packaging/arch/PKGBUILD.in > dist/PKGBUILD
      - name: Install minisign (Ubuntu archive)
        run: sudo apt-get update -q && sudo apt-get install -y -q minisign
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          MINISIGN_KEY_FILE="$key" scripts/sign-release.sh "$VERSION" dist remotemusicrp.pub
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "RemoteMusicRP $VERSION" \
            --notes-file packaging/ci/release-notes.md
