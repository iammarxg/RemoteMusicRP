# SPDX-License-Identifier: AGPL-3.0-only
#
# Docker images, built from the SIGNED release binaries after the owner
# publishes a release (drafts never trigger this).
#
#   ammarx4/remotemusicrp:<version>-sdk, :latest-sdk   server mode, amd64
#   ammarx4/remotemusicrp:<version>,     :latest       distroless, amd64+arm64
#
# Each image is signed with Sigstore cosign (keyless, tied to this workflow)
# and gets an SBOM + provenance attestation from BuildKit.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token
# limited to Read & Write on ammarx4/remotemusicrp).

name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: docker.io/ammarx4/remotemusicrp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the signed Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG" >&2; exit 1; }
          version=${TAG#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          mkdir -p rel ctx/bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel \
            -p 'remotemusicrp-x86_64-unknown-linux-gnu' -p 'remotemusicrp-x86_64-unknown-linux-gnu.minisig' \
            -p 'remotemusicrp-aarch64-unknown-linux-gnu' -p 'remotemusicrp-aarch64-unknown-linux-gnu.minisig' \
            -p 'SHA256SUMS' -p 'SHA256SUMS.minisig'
          cd rel
          for f in remotemusicrp-x86_64-unknown-linux-gnu remotemusicrp-aarch64-unknown-linux-gnu SHA256SUMS; do
            minisign -V -q -p ../remotemusicrp.pub -m "$f"
            # The trusted comment must name this exact version and file.
            minisign -V -p ../remotemusicrp.pub -m "$f" | grep -qx "Trusted comment: remotemusicrp $version $f"
          done
          grep -E ' \*?remotemusicrp-(x86_64|aarch64)-unknown-linux-gnu$' SHA256SUMS | sed 's/ \*/  /' | sha256sum -c -
          cd ..
          cp rel/remotemusicrp-x86_64-unknown-linux-gnu ctx/bin/remotemusicrp-amd64
          cp rel/remotemusicrp-aarch64-unknown-linux-gnu ctx/bin/remotemusicrp-arm64
          cp packaging/docker/Dockerfile packaging/docker/remotemusicrp.toml ctx/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: sdk
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          target: sdk
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}-sdk
            ${{ env.IMAGE }}:latest-sdk
      - id: default
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          target: default
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign images (keyless)
        env:
          SDK_DIGEST: ${{ steps.sdk.outputs.digest }}
          DEFAULT_DIGEST: ${{ steps.default.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$SDK_DIGEST"
          cosign sign --yes "$IMAGE@$DEFAULT_DIGEST"
