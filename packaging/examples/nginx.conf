# nginx in front of RemoteMusicRP. Get a certificate first (for example
# with certbot), then in the RemoteMusicRP config set:
#   public_origin = "https://remotemusicrp.example.com"

server {
    listen 80;
    listen [::]:80;
    server_name remotemusicrp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name remotemusicrp.example.com;

    ssl_certificate     /etc/letsencrypt/live/remotemusicrp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remotemusicrp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8484;
        # RemoteMusicRP checks Host and Origin against public_origin.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
