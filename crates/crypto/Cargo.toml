[package]
name = "remotemusicrp-crypto"
description = "Envelope encryption, key management, password hashing and TOTP for RemoteMusicRP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Store the master keyring in the OS keystore (Windows Credential Manager,
# macOS Keychain, Linux Secret Service).
os-keystore = ["dep:keyring"]

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
secrecy = "0.10.3"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

keyring = { version = "4.2.0", optional = true }

[dev-dependencies]

[lints]
workspace = true
